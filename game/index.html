<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>占城大师 - PVE版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>占城大师</h1>
            <p>点击开始游戏</p>
            <button id="start-btn">开始游戏</button>
        </div>
        
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="player-info">
                    <span class="label">🏰 我方主城</span>
                    <div class="health-bar">
                        <div id="player-hp" class="hp-fill"></div>
                    </div>
                    <span id="player-hp-text">100%</span>
                </div>
                <div class="turn-info">
                    <span>回合 <span id="turn-number">1</span></span>
                </div>
                <div class="enemy-info">
                    <span>敌方主城 🏰</span>
                    <div class="health-bar enemy">
                        <div id="enemy-hp" class="hp-fill"></div>
                    </div>
                    <span id="enemy-hp-text">100%</span>
                </div>
            </div>
            
            <div class="map-container" id="map-container">
                <div id="map-grid"></div>
            </div>
            
            <div class="control-panel">
                <div id="unit-info" class="unit-info">
                    <p>点击格子探索或选择单位</p>
                </div>
                <button id="end-turn-btn" class="end-turn-btn">结束回合</button>
            </div>
        </div>
        
        <div id="game-over" class="overlay">
            <div class="result-content">
                <h2 id="result-text"></h2>
                <button id="restart-btn">重新开始</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
